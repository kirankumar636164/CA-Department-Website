<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - CompApps</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/gallery.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- HERO -->
<section class="gallery-hero text-center">
  <div class="container">
    <h1>Gallery</h1>
    <p>Moments from events, workshops, and achievements.</p>
  </div>
</section>

<!-- GALLERY -->
<section class="gallery-section">
  <div class="container">

    <div class="row g-3">

      <!-- IMAGE -->
      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/Group1.jfif" alt="">
        </div>
      </div>

      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/Certified People.jfif" alt="">
        </div>
      </div>

      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/Certified People2.jfif" alt="">
        </div>
      </div>

      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/hackathon.jfif" alt="">
        </div>
      </div>

      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/seminar.jfif" alt="">
        </div>
      </div>

      <div class="col-md-4">
        <div class="gallery-item">
          <img src="assets/images/Gallery/Team work.jfif" alt="">
        </div>
      </div>

    </div>

  </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
