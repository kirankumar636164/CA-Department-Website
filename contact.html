<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Us - CompApps</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/contact.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- HERO -->
<section class="contact-hero text-center">
  <div class="container">
    <h1>Join Our Department</h1>
    <p>Start your journey in technology today.</p>
  </div>
</section>

<!-- CONTACT -->
<section class="contact-section">
  <div class="container">
    <div class="row g-5 align-items-center">

      <!-- INFO -->
      <div class="col-lg-5">
        <h2>Get in Touch</h2>
        <p>Have questions or want to join? Fill the form and we’ll get back to you.</p>

        <div class="contact-info">
          <p><i class="bi bi-geo-alt-fill"></i> Bengaluru, India</p>
          <p><i class="bi bi-envelope-fill"></i> compapps@college.edu</p>
          <p><i class="bi bi-telephone-fill"></i> +91 98765 43210</p>
        </div>
      </div>

      <!-- FORM -->
      <div class="col-lg-7">
        <form class="contact-form">

          <div class="row g-3">

            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="col-md-6">
              <input type="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Phone Number">
            </div>

            <div class="col-md-6">
              <select class="form-control">
                <option selected disabled>Select Course</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>BCA (Hons)</option>
              </select>
            </div>

            <div class="col-12">
              <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">
                Submit Application
              </button>
            </div>

          </div>

        </form>
      </div>

    </div>
  </div>
</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
